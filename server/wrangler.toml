# Het scorebord van 10 Tickets naar Vrijheid. Uitleg en deploy-stappen: README.md.

name = "tickets-scorebord"
main = "worker.js"
compatibility_date = "2026-09-01"

# Een adres van de vorm https://tickets-scorebord.<jouw-naam>.workers.dev
workers_dev = true

# Privacy: geen logs, geen sporen. De code gebruikt ook geen console.*.
# (Dit moet boven de eerste [tabel] staan, anders leest TOML het als een veld van die tabel.)
logpush = false

# De opslag, aangemaakt met `npx wrangler kv namespace create SCORES`.
[[kv_namespaces]]
binding = "SCORES"
id = "b083be9805a845608e137c28154c99a5"

[observability]
enabled = false
