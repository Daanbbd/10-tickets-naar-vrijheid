<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

/* --- De aanraakpoort ---------------------------------------------------
   iOS Safari geeft een AudioContext pas vrij binnen de afhandeling van een
   echte aanraking. De standaardshell start het spel meteen bij page-load,
   dus de eerste noot van het titelscherm valt altijd tegen een bevroren
   context. Deze poort zorgt dat er een tik geweest is voordat de engine
   begint; het downloaden loopt ondertussen gewoon door. */
#gate {
	position: absolute;
	inset: 0;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
	background-color: $GODOT_SPLASH_COLOR;
	color: #e8e8ea;
	font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
	text-align: center;
	cursor: pointer;
	-webkit-tap-highlight-color: transparent;
	-webkit-user-select: none;
	user-select: none;
}

#gate.visible { display: flex; }

#gate-title { font-size: 15px; letter-spacing: 0.12em; opacity: 0.55; }

#gate-action {
	font-size: 20px;
	padding: 14px 26px;
	border: 1px solid #4a4a52;
	border-radius: 3px;
	animation: gate-pulse 2.4s ease-in-out infinite;
}

#gate-note { font-size: 12px; opacity: 0.45; max-width: 260px; line-height: 1.5; }

@keyframes gate-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="gate">
			<div id="gate-title">10 TICKETS NAAR VRIJHEID</div>
			<div id="gate-action">Tik om te beginnen</div>
			<div id="gate-note">Met geluid. Zet je telefoon niet op stil.</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');

		// --- De aanraakpoort ---------------------------------------------
		//
		// Waarom dit hier staat en niet in GDScript: op iOS Safari komt een
		// AudioContext gesuspendeerd terug als hij buiten een user gesture
		// wordt aangemaakt, en Godot maakt de zijne aan tijdens `startGame()`.
		// De standaardshell roept dat meteen bij page-load aan, dus de context
		// was daar per definitie bevroren en het titelscherm speelde zijn
		// muziek tegen een dood audiopad. `_godot_audio_resume` bestaat wel in
		// de build maar heeft geen enkele DOM-listener: hij hangt volledig aan
		// Godots eigen inputpad, dat pas draait als het spel al loopt.
		//
		// `init()` doet het downloaden en compileren van de wasm; dat mag
		// gewoon vast lopen terwijl de poort in beeld staat. Alleen
		// `startGame()` wacht op de tik.
		const gate = document.getElementById('gate');
		let gestart = false;

		function start() {
			if (gestart) {
				return;
			}
			gestart = true;
			gate.classList.remove('visible');

			// Diagnose, alleen met ?audio in de URL. Godots eigen AudioContext
			// zit in de moduleclosure en is van buiten niet te lezen, maar een
			// context die we hier in dezelfde tik aanmaken deelt wel het beleid
			// van de pagina. Dat scheidt de twee mogelijke oorzaken zodra
			// iemand meldt dat hij niets hoort: staat deze op "running" en is
			// het toch stil, dan ligt het niet aan de autoplay-policy maar in
			// Godots audiopad (de worklet). Staat hij op "suspended", dan is de
			// tik niet als gesture aangekomen.
			if (window.location.search.indexOf('audio') !== -1) {
				try {
					const Ctx = window.AudioContext || window.webkitAudioContext;
					const probe = new Ctx();
					probe.resume();
					const toon = () => {
						gate.classList.add('visible');
						document.getElementById('gate-action').textContent = 'audio: ' + probe.state;
						document.getElementById('gate-note').textContent = probe.sampleRate + ' Hz'
							+ ' \u00b7 worklet: ' + (typeof AudioWorkletNode !== 'undefined');
						gate.style.pointerEvents = 'none';
						gate.style.background = 'transparent';
					};
					setTimeout(toon, 1500);
				} catch (err) {
					console.error('audio-diagnose faalde:', err);
				}
			}

			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			}).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		}

		// `init()` wil het basispad als de engine nog niet geladen is; dat is
		// `executable` uit GODOT_CONFIG ("index"), hetzelfde dat `startGame()`
		// zelf gebruikt.
		engine.init(GODOT_CONFIG.executable).then(() => {
			setStatusMode('hidden');
			gate.classList.add('visible');
		}, displayFailureNotice);

		// `pointerdown` en niet `click`: op iOS telt de eerste een gesture, en
		// hij vuurt vroeger. `keydown` erbij voor een toetsenbord, want daar is
		// een muisklik niet vanzelfsprekend.
		gate.addEventListener('pointerdown', start, { once: true });
		window.addEventListener('keydown', start, { once: true });
	}
}());
		</script>
	</body>
</html>
