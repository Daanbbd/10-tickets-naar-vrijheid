<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

/* --- De aanraakpoort ---------------------------------------------------
   iOS Safari geeft een AudioContext pas vrij binnen de afhandeling van een
   echte aanraking. De standaardshell start het spel meteen bij page-load,
   dus de eerste noot van het titelscherm valt altijd tegen een bevroren
   context. Deze poort zorgt dat er een tik geweest is voordat de engine
   begint; het downloaden loopt ondertussen gewoon door. */
#gate {
	position: absolute;
	inset: 0;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
	background-color: $GODOT_SPLASH_COLOR;
	color: #e8e8ea;
	font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
	text-align: center;
	cursor: pointer;
	-webkit-tap-highlight-color: transparent;
	-webkit-user-select: none;
	user-select: none;
}

#gate.visible { display: flex; }

#gate-title { font-size: 15px; letter-spacing: 0.12em; opacity: 0.55; }

#gate-action {
	font-size: 20px;
	padding: 14px 26px;
	border: 1px solid #4a4a52;
	border-radius: 3px;
	animation: gate-pulse 2.4s ease-in-out infinite;
}

#gate-note { font-size: 12px; opacity: 0.45; max-width: 260px; line-height: 1.5; }

@keyframes gate-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="gate">
			<div id="gate-title">10 TICKETS NAAR VRIJHEID</div>
			<div id="gate-action">Tik om te beginnen</div>
			<div id="gate-note">Met geluid. Zet je telefoon niet op stil.</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');

		// --- De aanraakpoort ---------------------------------------------
		//
		// Waarom dit hier staat en niet in GDScript: op iOS Safari komt een
		// AudioContext gesuspendeerd terug als hij buiten een user gesture
		// wordt aangemaakt, en Godot maakt de zijne aan tijdens `engine.start()`.
		// De standaardshell roept dat meteen bij page-load aan, dus de context
		// was daar per definitie bevroren en het titelscherm speelde zijn
		// muziek tegen een dood audiopad. `_godot_audio_resume` bestaat wel in
		// de build maar heeft geen enkele DOM-listener: hij hangt volledig aan
		// Godots eigen inputpad, dat pas draait als het spel al loopt.
		//
		// **7 sep, na een echte test op Daans iPhone: de poort alleen was niet
		// genoeg.** `?audio` gaf op zijn toestel `suspended`, terwijl dezelfde
		// build op desktop Chromium `running` gaf. De oorzaak zat niet in de
		// poort maar in wat er n\u00e1 de tik nog moest gebeuren.
		//
		// `engine.startGame()` \u2014 wat hier eerst stond \u2014 doet zelf
		// `Promise.all([init(exe), preloadFile(mainPack, mainPack)])` v\u00f3\u00f3rdat
		// het spel start. `init()` haalt alleen de wasm op; het hoofdpakket
		// (`index.pck`, ~6 MB) werd dus pas n\u00e1 de tik gedownload, \u00edn de
		// gesturehandler. Op localhost is dat een fetch van een paar
		// milliseconden en valt het niet op. Over een echt netwerk (Daans
		// telefoon tegen de gh-pages-CDN) duurt diezelfde fetch lang genoeg om
		// buiten het venster te vallen waarbinnen iOS Safari een AudioContext
		// nog aan een gesture koppelt \u2014 Chrome is daar veel rekkelijker in,
		// vandaar dat de desktoptest niets liet zien. Godots eigen context,
		// die pas ontstaat n\u00e1 die fetch, kwam daardoor alsnog gesuspendeerd
		// uit de bus, ook al was er getikt.
		//
		// De fix: het hoofdpakket ook v\u00f3\u00f3rladen, terwijl de poort nog niet eens
		// in beeld staat. N\u00e1 de tik blijft er dan geen netwerkwerk meer over \u2014
		// alleen `copyToFS()` en `callMain()`, synchrone JS die binnen het
		// gesturevenster past. Zie `engine.start()` verderop: dat is
		// `startGame()` met de twee stappen losgeknipt, niet een eigen vinding.
		const gate = document.getElementById('gate');
		let gestart = false;

		// Dezelfde afleiding als `Engine.prototype.startGame()` zelf gebruikt.
		const mainPack = GODOT_CONFIG.mainPack || (GODOT_CONFIG.executable + '.pck');

		// V\u00f3\u00f3r `init()`/`preloadFile()`, zodat de voortgangsbalk het hele
		// gewicht dekt (wasm + pck) en niet alleen de wasm zoals eerst.
		engine.config.onProgress = function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		};

		function start() {
			if (gestart) {
				return;
			}
			gestart = true;
			gate.classList.remove('visible');

			// Diagnose, alleen met ?audio in de URL.
			//
			// **7 sep, tweede ronde: een eigen schaduwcontext was de verkeerde
			// meting.** De eerste versie hier maakte z\u00edjn eigen `AudioContext`
			// aan om te testen of "de pagina" audio mag afspelen, en las die
			// terug als "running" \u2014 bij Daan zowel op desktop als op zijn
			// iPhone, n\u00e1 de preload-fix. Maar hij hoorde op zijn telefoon
			// nog steeds niets, terwijl zijn systeemgeluid (notificaties,
			// tabbladen) gewoon werkte. Dat betekent: de browser stond audio
			// toe, maar Godots \u00e9igen context \u2014 een andere, die pas later in
			// `callMain()` ontstaat \u2014 was daarmee niet aantoonbaar mee
			// ontgrendeld. Een schaduwcontext meet het beleid van de pagina,
			// niet wat er in Godots eigen audiopad gebeurt.
			//
			// Nu wordt `window.AudioContext`/`webkitAudioContext` hier tijdelijk
			// omwikkeld, vlak v\u00f3\u00f3r `engine.start()`. Godot roept die
			// constructor zelf aan in `_godot_audio_init()` (in `index.js`,
			// vanuit de wasm) \u2014 dit vangt dus z\u00edjn \u00e9chte context af, niet een
			// imitatie. De wikkel gaat er na het lezen weer af; hij verandert
			// niets aan hoe het spel normaal draait.
			let __godotAudioLog = null;
			let __godotWorkletLog = null;
			if (window.location.search.indexOf('audio') !== -1) {
				try {
					const EchteCtx = window.AudioContext || window.webkitAudioContext;
					__godotAudioLog = [];
					function GewikkeldeCtx(...args) {
						const ctx = new EchteCtx(...args);
						__godotAudioLog.push({ ctx: ctx, tMs: Math.round(performance.now()) });
						return ctx;
					}
					GewikkeldeCtx.prototype = EchteCtx.prototype;
					window.AudioContext = GewikkeldeCtx;
					window.webkitAudioContext = GewikkeldeCtx;

					// Tweede laag: laadt Godots eigen worklet-module echt? Een
					// context die "running" meldt zegt niets over of het geluid
					// er ook echt uit komt \u2014 de AudioWorkletNode die het
					// daadwerkelijke mixen doet heeft zijn module nodig
					// (`index.audio.worklet.js`), en `addModule()` kan om allerlei
					// redenen falen zonder dat de context daar iets van laat
					// blijken. Dit is precies het tweede rijtje uit de
					// diagnosetabel in `docs/TESTING.md`: "running, en toch
					// stil" wijst hierheen.
					__godotWorkletLog = [];
					if (typeof AudioWorklet !== 'undefined') {
						const echtAddModule = AudioWorklet.prototype.addModule;
						AudioWorklet.prototype.addModule = function (url, opts) {
							const item = { url: url, tMs: Math.round(performance.now()), status: 'bezig' };
							__godotWorkletLog.push(item);
							return echtAddModule.call(this, url, opts).then(
								(r) => { item.status = 'ok'; return r; },
								(e) => { item.status = 'FOUT: ' + (e && e.message || e); throw e; },
							);
						};
					}

					const toon = () => {
						window.AudioContext = EchteCtx;
						window.webkitAudioContext = EchteCtx;
						gate.classList.add('visible');
						gate.style.pointerEvents = 'none';
						gate.style.background = 'transparent';
						if (__godotAudioLog.length === 0) {
							document.getElementById('gate-action').textContent = 'godot: geen AudioContext gemaakt';
							document.getElementById('gate-note').textContent = 'de audiodriver is niet gestart \u2014 geen autoplay-probleem meer';
							return;
						}
						const laatste = __godotAudioLog[__godotAudioLog.length - 1];
						document.getElementById('gate-action').textContent = 'godot: ' + laatste.ctx.state
							+ (__godotAudioLog.length > 1 ? ' (' + __godotAudioLog.length + 'x aangemaakt)' : '');
						const workletTekst = __godotWorkletLog.length === 0
							? 'geen worklet geladen'
							: __godotWorkletLog.map((w) => w.status).join(', ');
						document.getElementById('gate-note').textContent = laatste.ctx.sampleRate + ' Hz'
							+ ' \u00b7 na ' + laatste.tMs + ' ms \u00b7 worklet: ' + workletTekst;
					};
					setTimeout(toon, 4000);
				} catch (err) {
					console.error('audio-diagnose faalde:', err);
				}
			}

			// `engine.start()` en niet `engine.startGame()`: die laatste zou
			// het hoofdpakket hier, \u00edn de tik, n\u00f3g een keer proberen te
			// downloaden. Het zit al in `preloader.preloadedFiles` (zie
			// `Promise.all(...)` verderop), dus dit is alleen nog
			// `copyToFS()` + `callMain()` \u2014 geen fetch, geen wachttijd die het
			// gesturevenster kan doorbreken.
			engine.start({
				args: ['--main-pack', mainPack].concat(GODOT_CONFIG.args),
			}).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		}

		// `init()` wil het basispad als de engine nog niet geladen is; dat is
		// `executable` uit GODOT_CONFIG ("index"), hetzelfde dat `startGame()`
		// zelf gebruikt. Het hoofdpakket gaat er parallel bij: zie de lange
		// toelichting hierboven voor waarom dat niet tot n\u00e1 de tik mag wachten.
		Promise.all([
			engine.init(GODOT_CONFIG.executable),
			engine.preloadFile(mainPack, mainPack),
		]).then(() => {
			setStatusMode('hidden');
			gate.classList.add('visible');
		}, displayFailureNotice);

		// `pointerdown` en niet `click`: op iOS telt de eerste een gesture, en
		// hij vuurt vroeger. `keydown` erbij voor een toetsenbord, want daar is
		// een muisklik niet vanzelfsprekend.
		gate.addEventListener('pointerdown', start, { once: true });
		window.addEventListener('keydown', start, { once: true });
	}
}());
		</script>
	</body>
</html>
